name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: Tests/run.sh

  bundle:
    name: Build app bundle
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build app bundle
        run: ./package.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: turtlemeck-app-bundle
          path: |
            .build/turtlemeck.zip
            .build/turtlemeck.dmg
            .build/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
